name: Daily update

on:
  schedule:
    # Noon UTC every weekday — Morning Ireland is Mon–Fri
    # (UTC+0 in winter = 12pm Irish time; UTC+1 summer = still caught by midday)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      recategorise:
        description: 'Re-categorise all existing CSV rows with Claude'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated CSV + docs/ back

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install anthropic openai

      - name: Recategorise existing rows (if requested)
        if: ${{ inputs.recategorise }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_ireland.py --recategorise

      - name: Transcribe full show
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_ireland_audio.py

      - name: Fetch RSS and update CSV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python morning_ireland.py

      - name: Build HTML
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add morning_ireland_data.csv docs/ transcripts/
          # Only commit if something actually changed
          git diff --staged --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git push
